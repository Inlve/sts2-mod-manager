<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STS2 Mod Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
      /* 自定义标题栏拖拽区（Tauri 用 data-tauri-drag-region 标记） */
      .titlebar { -webkit-app-region: drag; app-region: drag; }
      .titlebar button { -webkit-app-region: no-drag; app-region: no-drag; }
      /* 滚动条：宽、高必须同时指定，否则只有纵向是细条、横向会退回系统粗条 */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
      ::-webkit-scrollbar-corner { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 启动期错误兜底：白屏时至少能看到原因 -->
    <script>
      window.addEventListener('error', function (e) {
        var el = document.getElementById('root');
        if (!el || el.childElementCount > 0) return;
        var err = e.error || {};
        el.innerHTML =
          '<div style="padding:40px;font-family:monospace;color:#dc2626;background:#fef2f2;margin:20px;border-radius:8px;border:1px solid #fca5a5">' +
          '<h2 style="margin-bottom:12px">启动错误</h2>' +
          '<p><b>Error:</b> ' + (e.message || '') + '</p>' +
          '<p><b>Source:</b> ' + (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0) + '</p>' +
          '<pre style="margin-top:12px;white-space:pre-wrap;font-size:12px">' + (err.stack || '') + '</pre>' +
          '<p style="margin-top:16px;color:#666">请将此信息截图反馈</p></div>';
      });
    </script>
  </body>
</html>
